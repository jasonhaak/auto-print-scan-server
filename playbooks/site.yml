---
- name: Commission the print and scan server
  hosts: print_servers
  become: true
  force_handlers: true
  vars_files:
    - ../vars/driver_profiles.yml
  roles:
    - role: driver_catalog
      tags: always
    - role: common
      tags: common
    - role: direct_ethernet
      tags: direct_ethernet
    - role: device_definition
      tags: device_definition
    - role: users
      tags: users
    - role: ssh
      tags: ssh
    - role: firewall
      tags: firewall
    - role: updates
      tags: updates
    - role: package_profiles
      tags: package_profiles
    - role: ipp_usb
      tags: ipp_usb
    - role: cups
      tags: cups
    - role: avahi
      tags: avahi
    - role: sane
      tags: sane
    - role: device_preflight
      tags: device_preflight
    - role: scanservjs
      tags: scanservjs
