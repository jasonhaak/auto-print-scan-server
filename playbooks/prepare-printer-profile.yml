---
- name: Prepare selected legacy printer driver packages
  hosts: print_servers
  become: true
  gather_facts: false
  vars_files:
    - ../vars/driver_profiles.yml
  vars:
    selected_package_profiles: []
  pre_tasks:
    - name: Gather the target architecture and release
      ansible.builtin.setup:
        filter:
          - ansible_architecture
          - ansible_distribution_release
          - ansible_distribution_major_version
  roles:
    - role: driver_catalog
      tags: always
  tasks:
    - name: Validate selected legacy driver profiles
      ansible.builtin.assert:
        that:
          - item in package_profiles
          - package_profiles[item].packages is iterable
          - package_profiles[item].packages | length > 0
      loop: "{{ selected_package_profiles }}"

    - name: Install CUPS for legacy model inspection
      ansible.builtin.apt:
        name: [cups, cups-filters]
        state: present

    - name: Refresh package metadata before simulating
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Simulate installing each selected package profile
      ansible.builtin.command:
        argv: "{{ ['apt-get', '-s', 'install', '--no-remove'] + package_profiles[item].packages }}"
      register: package_profile_simulation
      changed_when: false
      failed_when: >-
        package_profile_simulation.rc != 0 or
        (package_profile_simulation.stdout_lines | select('match', '^Remv ') | list | length > 0)
      loop: "{{ selected_package_profiles }}"
      loop_control:
        label: "{{ item }}"

    - name: Install selected legacy driver packages
      ansible.builtin.apt:
        name: "{{ package_profiles[item].packages }}"
        state: present
      loop: "{{ selected_package_profiles }}"

    - name: Start CUPS for legacy model inspection
      ansible.builtin.service:
        name: cups
        enabled: true
        state: started
