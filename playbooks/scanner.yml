---
- name: Configure scan services
  hosts: print_servers
  become: true
  vars_files:
    - ../vars/driver_profiles.yml
  roles:
    - role: driver_catalog
      tags: always
    - role: device_definition
      tags: device_definition
    - role: package_profiles
      tags: package_profiles
    - role: sane
      tags: sane
    - role: scanservjs
      when: managed_scanners | length > 0
      tags: scanservjs
    - role: scanservjs
      tasks_from: absent
      when: managed_scanners | length == 0
      tags: scanservjs
