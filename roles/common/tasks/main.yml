---
- name: Detect Raspberry Pi OS
  ansible.builtin.stat:
    path: /etc/rpi-issue
  register: common_raspberry_pi_os
  tags: common

- name: Assert the supported operating system and architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version in common_supported_debian_major_versions
      - ansible_facts.architecture in common_supported_architectures
      - common_raspberry_pi_os.stat.exists
    fail_msg: >-
      Unsupported platform: {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_major_version }} on {{ ansible_facts.architecture }}.
      This release supports Raspberry Pi OS with Debian major version(s)
      {{ common_supported_debian_major_versions | join(', ') }} on
      {{ common_supported_architectures | join(', ') }}. Extend the compatibility policy only
      after repository QA and hardware acceptance for the new platform.
  tags: common

- name: Refresh the APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: common

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags: common

- name: Upgrade packages when explicitly requested
  ansible.builtin.apt:
    upgrade: dist
  when: common_package_upgrade | bool
  notify: Check whether a reboot is required
  tags: common

- name: Set the system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  tags: common

- name: Configure the system locale
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present
  tags: common

- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  tags: common
