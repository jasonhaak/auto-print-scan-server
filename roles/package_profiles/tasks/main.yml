---
- name: Select explicitly configured device package profiles
  ansible.builtin.set_fact:
    selected_package_profiles: "{{ device_package_profiles }}"
  tags: package_profiles

- name: Validate selected package profiles
  ansible.builtin.assert:
    that: item in package_profiles
    fail_msg: "Unknown package profile: {{ item }}"
  loop: "{{ selected_package_profiles }}"
  tags: package_profiles

- name: Refresh package metadata before simulating
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  tags: package_profiles

- name: Simulate installing each selected package profile
  ansible.builtin.command:
    argv: "{{ ['apt-get', '-s', 'install', '--no-remove'] + package_profiles[item].packages }}"
  register: package_profile_simulation
  changed_when: false
  failed_when: >-
    package_profile_simulation.rc != 0 or
    (package_profile_simulation.stdout_lines | select('match', '^Remv ') | list | length > 0)
  loop: "{{ selected_package_profiles }}"
  loop_control:
    label: "{{ item }}"
  tags: package_profiles

- name: Install packages from selected profiles
  ansible.builtin.apt:
    name: "{{ package_profiles[item].packages }}"
    state: present
  loop: "{{ selected_package_profiles }}"
  tags: package_profiles
