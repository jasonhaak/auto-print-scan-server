---
- name: Query declared legacy printers without changing them
  ansible.builtin.command:
    argv:
      - ipptool
      - -tv
      - "{{ item.device_uri }}"
      - get-printer-attributes.test
  register: printer_discovery_result
  changed_when: false
  failed_when: false
  when: item.device_uri is match('^ipps?://')
  loop: "{{ managed_printers | selectattr('driver_mode', 'equalto', 'package_profile') | list }}"
  loop_control:
    label: "{{ item.name }}"
  tags: printer_discovery

- name: Report legacy printer discovery results
  ansible.builtin.debug:
    msg: >-
      {% if item.skipped | default(false) -%}
      Printer {{ item.item.name }} uses a {{ item.item.device_uri.split('://')[0] }}:// endpoint,
      which ipptool cannot query directly. Package-profile selection remains operator-approved.
      {%- else -%}
      Printer {{ item.item.name }} query {{ 'succeeded' if item.rc == 0 else 'was unavailable' }}.
      Package-profile selection remains operator-approved.
      {%- endif %}
  loop: "{{ printer_discovery_result.results | default([]) }}"
  tags: printer_discovery

- name: Report catalog matches for discovered printers
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, playbook_dir ~ '/../scripts/lib/device_inventory.py',
          '--catalog-suite', driver_catalog_identity.suite,
          '--catalog-architecture', driver_catalog_identity.package_architecture,
          '--catalog-repository', driver_catalog_identity.repository_identity]
         + (['--enable-generated-catalog'] if driver_catalog_generated_enabled | bool else [])
         + ['profiles-for-evidence', item.stdout] }}
  register: printer_discovery_catalog
  changed_when: false
  failed_when: false
  loop: "{{ printer_discovery_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  delegate_to: localhost
  become: false
  when:
    - not (item.skipped | default(false))
    - item.rc == 0
  tags: printer_discovery

- name: Report the catalog matches
  ansible.builtin.debug:
    msg: "{{ item.stdout_lines }}"
  loop: "{{ printer_discovery_catalog.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  when: item.stdout_lines | default([]) | length > 0
  tags: printer_discovery

- name: Report the optional driverless compatibility reference
  ansible.builtin.debug:
    msg: >-
      OpenPrinting's driverless printer reference is available at {{ openprinting_reference_url }}.
      No device details were sent by this playbook.
  tags: printer_discovery
