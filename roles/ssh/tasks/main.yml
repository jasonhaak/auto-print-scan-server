---
- name: Prevent password-only administrator lockout
  ansible.builtin.assert:
    that:
      - >-
        (ssh_allow_password_authentication | bool) or
        ((managed_users | selectattr('authorized_keys', 'defined')
        | map(attribute='authorized_keys') | flatten | length) > 0)
    fail_msg: >-
      ssh_allow_password_authentication can be disabled only after at least one managed
      authorized key is declared.
  tags: ssh

- name: Ensure the SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: '0755'
  tags: ssh

- name: Configure print server SSH access
  ansible.builtin.template:
    src: 99-print-server.conf.j2
    dest: /etc/ssh/sshd_config.d/99-print-server.conf
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH
  tags: ssh
