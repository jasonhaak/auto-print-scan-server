---
- name: Ensure the SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: '0755'
  tags: ssh

- name: Configure print server SSH access
  ansible.builtin.template:
    src: 99-print-server.conf.j2
    dest: /etc/ssh/sshd_config.d/99-print-server.conf
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH
  tags: ssh
