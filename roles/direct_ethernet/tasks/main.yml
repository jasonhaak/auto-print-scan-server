---
- name: Validate direct Ethernet links
  ansible.builtin.assert:
    that:
      - item.interface is match('^[A-Za-z0-9_.-]+$')
      - item.pi_ipv4_cidr is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$')
      - item.device_ipv4 is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
      - item.interface != ansible_default_ipv4.interface
    fail_msg: >-
      A direct Ethernet link needs a valid interface, Pi IPv4 CIDR and device IPv4 address.
      It cannot use the Pi's default-route interface.
  loop: "{{ direct_ethernet_links }}"
  loop_control:
    label: "{{ item.interface | default('unnamed interface') }}"
  tags: direct_ethernet

- name: Configure private direct Ethernet links
  community.general.nmcli:
    conn_name: "raspberry-print-server-{{ item.interface }}"
    ifname: "{{ item.interface }}"
    type: ethernet
    method4: manual
    ip4: "{{ item.pi_ipv4_cidr }}"
    autoconnect: true
    state: present
  loop: "{{ direct_ethernet_links }}"
  loop_control:
    label: "{{ item.interface }}"
  tags: direct_ethernet
