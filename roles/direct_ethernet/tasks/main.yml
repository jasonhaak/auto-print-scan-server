---
- name: Validate direct Ethernet links
  ansible.builtin.assert:
    that:
      - item.interface is match('^[A-Za-z0-9_.-]+$')
      - item.server_ipv4_cidr is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$')
      - item.device_ipv4 is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
      - item.interface != ansible_default_ipv4.interface
    fail_msg: >-
      A direct Ethernet link needs a valid interface, server IPv4 CIDR and device IPv4 address.
      It cannot use the server's default-route interface.
  loop: "{{ direct_ethernet_links }}"
  loop_control:
    label: "{{ item.interface | default('unnamed interface') }}"
  tags: direct_ethernet

- name: Validate direct Ethernet network membership
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - >-
        import ipaddress, json, sys;
        server_ip = ipaddress.ip_interface(sys.argv[1]);
        device = ipaddress.ip_address(sys.argv[2]);
        trusted = [ipaddress.ip_network(item) for item in json.loads(sys.argv[3])];
        valid = server_ip.version == 4 and server_ip.network.prefixlen == 30 and
        device.version == 4 and device in server_ip.network and
        device not in (server_ip.ip, server_ip.network.network_address, server_ip.network.broadcast_address) and
        not any(network.version == 4 and server_ip.network.overlaps(network) for network in trusted);
        raise SystemExit(0 if valid else 'direct link must use a distinct IPv4 /30 outside the trusted LAN')
      - "{{ item.server_ipv4_cidr }}"
      - "{{ item.device_ipv4 }}"
      - "{{ trusted_lan_cidrs | to_json }}"
  loop: "{{ direct_ethernet_links }}"
  loop_control:
    label: "{{ item.interface }}"
  changed_when: false
  tags: direct_ethernet

- name: Configure private direct Ethernet links
  community.general.nmcli:
    conn_name: "auto-print-scan-server-{{ item.interface }}"
    ifname: "{{ item.interface }}"
    type: ethernet
    method4: manual
    ip4: "{{ item.server_ipv4_cidr }}"
    never_default4: true
    method6: disabled
    autoconnect: true
    state: present
  loop: "{{ direct_ethernet_links }}"
  loop_control:
    label: "{{ item.interface }}"
  tags: direct_ethernet

- name: Create direct Ethernet ownership state directory
  ansible.builtin.file:
    path: /var/lib/auto-print-scan-server
    state: directory
    mode: '0755'
  tags: direct_ethernet

- name: Read previously managed direct Ethernet interfaces
  ansible.builtin.slurp:
    src: /var/lib/auto-print-scan-server/direct-ethernet-interfaces
  register: direct_ethernet_state
  failed_when: false
  changed_when: false
  tags: direct_ethernet

- name: Remove direct Ethernet links no longer declared
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - delete
      - "auto-print-scan-server-{{ item }}"
  loop: >-
    {{ (direct_ethernet_state.content | default('') | b64decode).splitlines()
       | difference(direct_ethernet_links | map(attribute='interface') | list) }}
  register: direct_ethernet_removed
  changed_when: direct_ethernet_removed.rc == 0
  failed_when:
    - direct_ethernet_removed.rc != 0
    - "'unknown connection' not in direct_ethernet_removed.stderr | lower"
  tags: direct_ethernet

- name: Save managed direct Ethernet interface state
  ansible.builtin.copy:
    content: >-
      {{ direct_ethernet_links | map(attribute='interface') | join('\n')
         }}{{ '\n' if direct_ethernet_links | length > 0 else '' }}
    dest: /var/lib/auto-print-scan-server/direct-ethernet-interfaces
    mode: '0644'
  tags: direct_ethernet
