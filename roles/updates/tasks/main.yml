---
- name: Install unattended upgrades when enabled
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: enable_unattended_upgrades | bool
  tags: updates

- name: Configure unattended security upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
  when: enable_unattended_upgrades | bool
  tags: updates

- name: Remove unattended upgrade configuration when disabled
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/20auto-upgrades
    state: absent
  when: not enable_unattended_upgrades | bool
  tags: updates
