---
- name: Validate firewall configuration
  ansible.builtin.assert:
    that:
      - trusted_lan_cidrs | length > 0
      - trusted_lan_cidrs | select('match', '^[0-9A-Fa-f:.]+/[0-9]{1,3}$') | list | length == trusted_lan_cidrs | length
      - firewall_ssh_port | int > 0
      - firewall_ssh_port | int < 65536
      - firewall_ipp_port | int > 0
      - firewall_ipp_port | int < 65536
      - firewall_scanservjs_port | int > 0
      - firewall_scanservjs_port | int < 65536
      - firewall_saned_port | int > 0
      - firewall_saned_port | int < 65536
    fail_msg: Configure at least one CIDR and valid TCP service ports before enabling the firewall.
  when: firewall_enabled | bool
  tags: firewall

- name: Validate custom firewall ports
  ansible.builtin.assert:
    that:
      - item | string is match('^[0-9]+$')
      - item | int > 0
      - item | int < 65536
    fail_msg: "Invalid custom firewall port: {{ item }}"
  loop: "{{ firewall_custom_ports }}"
  when: firewall_enabled | bool
  tags: firewall

- name: Validate trusted LAN networks precisely
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - "import ipaddress, sys; ipaddress.ip_network(sys.argv[1], strict=True)"
      - "{{ item }}"
  loop: "{{ trusted_lan_cidrs }}"
  changed_when: false
  when: firewall_enabled | bool
  tags: firewall

- name: Select the normal LAN interface for mDNS
  ansible.builtin.set_fact:
    firewall_active_lan_interface: >-
      {{ firewall_lan_interface | default(ansible_facts.default_ipv4.interface, true) }}
  tags: firewall

- name: Initialise desired managed firewall rules
  ansible.builtin.set_fact:
    firewall_desired_rules: []
  tags: firewall

- name: Add desired SSH rules
  ansible.builtin.set_fact:
    firewall_desired_rules: >-
      {{ firewall_desired_rules + [{'port': firewall_ssh_port | string, 'proto': 'tcp', 'from_ip': item}] }}
  loop: "{{ trusted_lan_cidrs }}"
  when: firewall_enabled | bool
  tags: firewall

- name: Add desired IPP rules
  ansible.builtin.set_fact:
    firewall_desired_rules: >-
      {{ firewall_desired_rules + [{'port': firewall_ipp_port | string, 'proto': 'tcp', 'from_ip': item}] }}
  loop: "{{ trusted_lan_cidrs }}"
  when:
    - firewall_enabled | bool
    - device_has_shared_printer | bool
  tags: firewall

- name: Add desired mDNS rules
  ansible.builtin.set_fact:
    firewall_desired_rules: >-
      {{ firewall_desired_rules + [{'port': firewall_mdns_port | string, 'proto': 'udp', 'from_ip': item,
         'direction': 'in', 'interface': firewall_active_lan_interface}] }}
  loop: "{{ trusted_lan_cidrs }}"
  when:
    - firewall_enabled | bool
    - device_has_shared_printer | bool
  tags: firewall

- name: Add desired ScanservJS rules
  ansible.builtin.set_fact:
    firewall_desired_rules: >-
      {{ firewall_desired_rules + [{'port': firewall_scanservjs_port | string, 'proto': 'tcp', 'from_ip': item}] }}
  loop: "{{ trusted_lan_cidrs }}"
  when:
    - firewall_enabled | bool
    - device_has_scanner | bool
  tags: firewall

- name: Add desired remote SANE rules
  ansible.builtin.set_fact:
    firewall_desired_rules: >-
      {{ firewall_desired_rules + [{'port': firewall_saned_port | string, 'proto': 'tcp', 'from_ip': item}] }}
  loop: "{{ trusted_lan_cidrs }}"
  when:
    - firewall_enabled | bool
    - device_has_scanner | bool
    - enable_remote_sane | bool
  tags: firewall

- name: Add desired custom service rules
  ansible.builtin.set_fact:
    firewall_desired_rules: >-
      {{ firewall_desired_rules + [{'port': item.1 | string, 'proto': 'tcp', 'from_ip': item.0}] }}
  loop: "{{ trusted_lan_cidrs | product(firewall_custom_ports) | list }}"
  when: firewall_enabled | bool
  tags: firewall

- name: Create firewall ownership state directory
  ansible.builtin.file:
    path: /var/lib/auto-print-scan-server
    state: directory
    mode: '0755'
  tags: firewall

- name: Read previously managed firewall rules
  ansible.builtin.slurp:
    src: /var/lib/auto-print-scan-server/ufw-rules.json
  register: firewall_rule_state
  failed_when: false
  changed_when: false
  tags: firewall

- name: Decode previously managed firewall rules
  ansible.builtin.set_fact:
    firewall_previous_rules: >-
      {{ (firewall_rule_state.content | default('W10=')) | b64decode | from_json }}
  tags: firewall

- name: Install UFW when enabled or previously managed
  ansible.builtin.apt:
    name: ufw
    state: present
  when: firewall_enabled | bool or firewall_previous_rules | length > 0
  tags: firewall

- name: Remove stale managed firewall rules
  community.general.ufw:
    rule: allow
    delete: true
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip }}"
    direction: "{{ item.direction | default(omit) }}"
    interface: "{{ item.interface | default(omit) }}"
  loop: "{{ firewall_previous_rules | reject('in', firewall_desired_rules) | list }}"
  loop_control:
    label: "{{ item.proto }}/{{ item.port }} from {{ item.from_ip }}"
  tags: firewall

- name: Set UFW default incoming policy
  community.general.ufw:
    default: deny
    direction: incoming
  when: firewall_enabled | bool
  tags: firewall

- name: Set UFW default outgoing policy
  community.general.ufw:
    default: allow
    direction: outgoing
  when: firewall_enabled | bool
  tags: firewall

- name: Add current managed firewall rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip }}"
    direction: "{{ item.direction | default(omit) }}"
    interface: "{{ item.interface | default(omit) }}"
    comment: auto-print-scan-server
  loop: "{{ firewall_desired_rules }}"
  loop_control:
    label: "{{ item.proto }}/{{ item.port }} from {{ item.from_ip }}"
  when: firewall_enabled | bool
  tags: firewall

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: firewall_enabled | bool
  tags: firewall

- name: Disable UFW for local development only
  community.general.ufw:
    state: disabled
  when: not firewall_enabled | bool
  tags: firewall

- name: Save managed firewall rule state
  ansible.builtin.copy:
    content: "{{ firewall_desired_rules | to_nice_json }}\n"
    dest: /var/lib/auto-print-scan-server/ufw-rules.json
    mode: '0644'
  tags: firewall
