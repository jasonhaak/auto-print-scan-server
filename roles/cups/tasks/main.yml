---
- name: Validate managed printer configuration
  ansible.builtin.assert:
    that:
      - managed_printers | map(attribute='name') | unique | list | length == managed_printers | length
      - item.name is match('^[A-Za-z0-9_.-]+$')
      - item.connection in ['usb', 'ipp', 'ipps', 'socket', 'lpd']
      - item.driver_mode in ['driverless', 'package_profile']
      - item.device_uri | length > 0
      - item.driver_mode != 'package_profile' or item.cups_model | default('') | length > 0
      - item.connection != 'usb' or item.usb_identity | default('') is match('^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{4}$')
      - item.dns_sd_name | default(item.name) is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      Every managed printer requires a unique safe queue name, supported connection, driver mode
      and URI. USB printers also require usb_identity.
  loop: "{{ managed_printers }}"
  loop_control:
    label: "{{ item.name | default('unnamed printer') }}"
  tags: cups

- name: Install CUPS and filters
  ansible.builtin.apt:
    name: [cups, cups-filters]
    state: present
  tags: cups

- name: Configure CUPS access and job retention
  ansible.builtin.template:
    src: cupsd.conf.j2
    dest: /etc/cups/cupsd.conf
    mode: '0644'
    validate: /usr/sbin/cupsd -t -c %s
  notify: Restart CUPS
  tags: cups

- name: Apply pending CUPS configuration changes
  ansible.builtin.meta: flush_handlers
  tags: cups

- name: Ensure the CUPS scheduler is enabled and running
  ansible.builtin.service:
    name: cups
    enabled: true
    state: started
  tags: cups

- name: Wait for the CUPS scheduler to accept commands
  ansible.builtin.command:
    argv: [lpstat, -r]
  register: cups_scheduler_status
  changed_when: false
  retries: 5
  delay: 1
  until: cups_scheduler_status.rc == 0 and 'scheduler is running' in cups_scheduler_status.stdout
  tags: cups

- name: List installed CUPS models for selected package profiles
  ansible.builtin.command:
    argv: [lpinfo, -m]
  register: cups_available_models
  changed_when: false
  when: managed_printers | selectattr('driver_mode', 'equalto', 'package_profile') | list | length > 0
  tags: cups

- name: Require each selected package-profile CUPS model
  ansible.builtin.assert:
    that: item.cups_model in cups_available_models.stdout
    fail_msg: >-
      Queue {{ item.name }} selected CUPS model {{ item.cups_model }}, but CUPS does not
      advertise it after installing package profile {{ item.package_profile }}. Run lpinfo -m
      on the Raspberry Pi, then choose an advertised model before retrying.
  loop: "{{ managed_printers | selectattr('driver_mode', 'equalto', 'package_profile') | list }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.package_profile }}"
  tags: cups

- name: Create CUPS ownership state directory
  ansible.builtin.file:
    path: /var/lib/raspberry-print-server
    state: directory
    mode: '0755'
  tags: cups

- name: Read previously managed CUPS queues
  ansible.builtin.slurp:
    src: /var/lib/raspberry-print-server/cups-queues
  register: cups_managed_queue_state
  failed_when: false
  changed_when: false
  tags: cups

- name: Remove queues no longer managed by Ansible
  ansible.builtin.command:
    argv:
      - lpadmin
      - -x
      - "{{ item }}"
  loop: >-
    {{ (cups_managed_queue_state.content | default('') | b64decode).splitlines()
       | difference(managed_printers | map(attribute='name') | list) }}
  changed_when: true
  tags: cups

- name: Read previously applied CUPS queue definitions
  ansible.builtin.slurp:
    src: /var/lib/raspberry-print-server/cups-queue-specs.json
  register: cups_managed_queue_specs
  failed_when: false
  changed_when: false
  tags: cups

- name: Decode previously applied CUPS queue definitions
  ansible.builtin.set_fact:
    cups_previous_queue_specs: >-
      {{ (cups_managed_queue_specs.content | default('W10=')) | b64decode | from_json }}
  tags: cups

- name: Query current managed CUPS queue endpoints
  ansible.builtin.command:
    argv:
      - lpstat
      - -v
      - "{{ item.name }}"
  loop: "{{ managed_printers }}"
  loop_control:
    label: "{{ item.name }}"
  register: cups_current_queue_endpoints
  failed_when: false
  changed_when: false
  tags: cups

- name: Reconcile managed CUPS queues
  ansible.builtin.command:
    argv:
      - lpadmin
      - -p
      - "{{ item.name }}"
      - -E
      - -v
      - "{{ item.device_uri }}"
      - -m
      - "{{ 'everywhere' if item.driver_mode == 'driverless' else item.cups_model }}"
      - -D
      - Ansible-managed print server queue
      - -o
      - "printer-is-shared={{ item.shared | default(true) | lower }}"
      - -o
      - "printer-dns-sd-name={{ item.dns_sd_name | default(item.name) }}"
      - -o
      - printer-error-policy=retry-current-job
  loop: "{{ managed_printers }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: cups_queue_index
  when: >-
    item not in cups_previous_queue_specs
    or cups_current_queue_endpoints.results[cups_queue_index].stdout
       != 'device for ' ~ item.name ~ ': ' ~ item.device_uri
  changed_when: true
  tags: cups

- name: Save managed CUPS queue ownership state
  ansible.builtin.copy:
    content: "{{ managed_printers | map(attribute='name') | join('\n') }}\n"
    dest: /var/lib/raspberry-print-server/cups-queues
    mode: '0644'
  tags: cups

- name: Save applied CUPS queue definitions
  ansible.builtin.copy:
    content: "{{ managed_printers | to_nice_json }}\n"
    dest: /var/lib/raspberry-print-server/cups-queue-specs.json
    mode: '0644'
  tags: cups
