---
name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

      - name: Check onboarding syntax
        run: bash -n scripts/onboard scripts/manage-devices scripts/setup scripts/qa scripts/lib/onboarding/*.sh

      - name: Test onboarding and inventory modules
        run: |
          for test_script in test/*.sh; do bash "$test_script"; done
          python test/device_inventory_test.py

      - name: Check playbook syntax
        run: |
          find playbooks -name '*.yml' -print0 | xargs -0 -r -n1 ansible-playbook --syntax-check
