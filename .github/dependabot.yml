version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    assignees:
      - "jasonhaak"
    commit-message:
      prefix: "deps"
    versioning-strategy: increase-if-necessary
    groups:
      tooling:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    assignees:
      - "jasonhaak"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
