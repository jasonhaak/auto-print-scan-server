---
package_profiles:
  brlaser:
    description: Brother laser printers supported by Debian's brlaser package
    packages:
      - printer-driver-brlaser
    # Prefix advertised by CUPS after the package is installed. The exact model is
    # selected interactively from the server's `lpinfo -m` output.
    model_prefix: drv:///brlaser.drv/
    make_model_pattern: '(?i)Brother.*MFC-7360'
